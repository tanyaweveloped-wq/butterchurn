<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Butterchurn (Milkdrop)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Projects the Butterchurn (Milkdrop) audio visualizer onto the inside of a sphere, viewable in WebXR." />

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#07070b" />
<link rel="icon" href="logo192.png" type="image/png" />
<link rel="apple-touch-icon" href="logo192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Butterchurn VR" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
  body { margin: 0; background: #111; color: #eee; font-family: Arial, sans-serif; }
  #ui { padding: 16px; }
  button { font-size: 16px; padding: 10px 16px; margin-right: 8px; margin-bottom: 8px; cursor: pointer; }
  #status { white-space: pre-wrap; font-size: 13px; color: #9cf; background: #1a1a22; border: 1px solid #333; border-radius: 4px; padding: 10px 12px; margin-top: 12px; max-width: 900px; max-height: 220px; overflow-y: auto; }
  #preview { display: block; margin-top: 12px; max-width: 480px; width: 100%; border: 1px solid #333; }
</style>
</head>
<body>
<div id="ui">
  <h2>Butterchurn → Mono XREquirectLayer</h2>
  <button id="enterVR" disabled>Enter VR (waiting for XR check…)</button>
  <button id="reenterVR" style="display:none; background:#2a7a4a; color:#fff; font-weight:bold;">▶ Tap to return to VR</button>
  <div style="font-size: 13px; color: #999; margin-top: 4px;">
    In VR: press the controller <strong>grip</strong> button to open/close the menu, and <strong>trigger</strong> to click.
  </div>
    <canvas id="test" width="900" height="700"></canvas>
    <div id="status"></div>
</div>

<script type="module">
import butterchurn from './libs/butterchurn@3.0.0-beta.5.js';

    document.addEventListener('DOMContentLoaded', function() {
      const statusEl = document.getElementById('status');
      const logHistory = [];
      const MAX_LOG_LINES = 200; // capped so a long session doesn't grow the DOM node unbounded
      const log = (msg) => {
        console.log(msg);
        const time = new Date().toLocaleTimeString();
        logHistory.push(`[${time}] ${msg}`);
        if (logHistory.length > MAX_LOG_LINES) logHistory.shift();
        if (statusEl) {
          statusEl.textContent = logHistory.join('\n');
          statusEl.scrollTop = statusEl.scrollHeight; // keep pinned to the newest line
        }
      };

  // Several functions here (startXR() from the file-picker re-entry paths,
  // checkXRSupport()'s auto-launch, etc.) are called fire-and-forget without
  // an await/catch at the call site. Without this, an exception partway
  // through one of them would just silently vanish — this is the safety net
  // that makes such failures visible instead of a mysterious "nothing happened".
  window.addEventListener('unhandledrejection', (evt) => {
    console.error('Unhandled promise rejection:', evt.reason);
    log('Unhandled error: ' + (evt.reason && evt.reason.message ? evt.reason.message : evt.reason));
  });


  // ---------------------------------------------------------------------------
  // PWA: service worker registration
  // ---------------------------------------------------------------------------
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => log('Service worker registered — app shell + presets can be cached for offline use.'))
      .catch((err) => console.error('Service worker registration failed:', err));

    navigator.serviceWorker.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'REFRESH_SHELL_DONE') {
        log('App shell cache refreshed.');
      }
    });
  }

  // ---------------------------------------------------------------------------
  // Detect "running as the installed Bubblewrap TWA on Quest" specifically —
  // this is what gates auto-entering VR without a click. Two things have to
  // both be true:
  //   1. display-mode: standalone — we're an installed app shell, not a tab
  //      in Quest Browser (a plain browser tab has no user-gesture cover for
  //      an unprompted requestSession call, so auto-launching there would
  //      just throw and log an error instead of skip gracefully).
  //   2. The UA reports Quest/Oculus — narrows this to the headset itself,
  //      so a desktop/Android TWA install of the same PWA (if you ever ship
  //      one) doesn't also try to auto-enter VR.
  const isInstalledQuestPwa = "";
    //window.matchMedia('(display-mode: standalone)').matches &&
    ///OculusBrowser|Quest/i.test(navigator.userAgent);

  // ---------------------------------------------------------------------------
  // Preset bundle: one big /presets-bundle.json instead of one request per
  // preset. Downloaded once, then "unpacked" — split back into individual
  // ./presets/<key>.json entries inside the service worker's cache — so
  // getPresetData() below can keep fetching per-key exactly as before, just
  // served from cache after this runs once instead of hitting the network
  // per preset. The License tab shows progress for both phases; see
  // drawPresetBundleLoadingScreen() and the 'license' tab branch in drawMenu().
  // ---------------------------------------------------------------------------
  const PRESET_BUNDLE_URL = './presets-bundle.json';
  const PRESET_BUNDLE_VERSION = 'v1'; // bump to force everyone to re-download+re-unpack
  const PRESET_BUNDLE_UNPACKED_KEY = 'butterchurnPresetBundleUnpacked';

  var presetBundleState = {
    // 'idle' | 'downloading' | 'unpacking' | 'ready' | 'error'
    status: localStorage.getItem(PRESET_BUNDLE_UNPACKED_KEY) === PRESET_BUNDLE_VERSION ? 'ready' : 'idle',
    loadedBytes: 0,
    totalBytes: 0,   // 0 = unknown (no Content-Length header)
    unpackedCount: 0,
    totalCount: 0,
    errorMessage: null,
  };

  var bundleLoadingRedrawTimer = null;
  // Keeps the License tab's progress bar animating smoothly even between
  // network chunks / unpack-progress messages (important for the
  // indeterminate case, when totalBytes is unknown). Self-stops once the
  // load leaves the downloading/unpacking states.
  function ensureBundleLoadingRedrawLoop() {
    if (bundleLoadingRedrawTimer) return;
    bundleLoadingRedrawTimer = setInterval(() => {
      const active = presetBundleState.status === 'downloading' || presetBundleState.status === 'unpacking';
      if (!active) {
        clearInterval(bundleLoadingRedrawTimer);
        bundleLoadingRedrawTimer = null;
        return;
      }
      if (menuActiveTab === 'license') drawMenu();
    }, 100);
  }

  // Sends the parsed bundle to the service worker, which writes each preset
  // in as its own cache entry (mapWithConcurrency-batched on that side —
  // see sw.js's UNPACK_PRESET_BUNDLE handler) and reports progress back.
  function unpackPresetBundleIntoCache(bundle) {
    return new Promise((resolve, reject) => {
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
        // No SW controlling this page yet (e.g. the very first load, before
        // it's finished activating) — not fatal, presets just get fetched
        // individually on demand this run instead of bulk-unpacked.
        resolve(0);
        return;
      }

      const controller = navigator.serviceWorker.controller;
      const onMessage = (event) => {
        const data = event.data || {};
        if (data.type === 'UNPACK_PROGRESS') {
          presetBundleState.unpackedCount = data.done;
          presetBundleState.totalCount = data.total;
          drawMenu();
        } else if (data.type === 'UNPACK_DONE') {
          navigator.serviceWorker.removeEventListener('message', onMessage);
          presetBundleState.unpackedCount = data.total;
          presetBundleState.totalCount = data.total;
          resolve(data.total);
        } else if (data.type === 'UNPACK_ERROR') {
          navigator.serviceWorker.removeEventListener('message', onMessage);
          reject(new Error(data.message || 'Unpack failed'));
        }
      };
      navigator.serviceWorker.addEventListener('message', onMessage);
      controller.postMessage({ type: 'UNPACK_PRESET_BUNDLE', presets: bundle });
    });
  }

  // Downloads presets-bundle.json (tracking byte progress via a streamed
  // read where possible), parses it, then unpacks it into the cache.
  // force=true (Settings "Refresh Cache" button) bypasses HTTP cache and
  // re-runs even if already marked ready; force=false (page load) skips
  // straight to 'ready' if we've already done this successfully before.
  async function loadAndUnpackPresetBundle(force) {
    if (!force && presetBundleState.status === 'ready') return;
    if (presetBundleState.status === 'downloading' || presetBundleState.status === 'unpacking') return;

    presetBundleState.status = 'downloading';
    presetBundleState.loadedBytes = 0;
    presetBundleState.totalBytes = 0;
    presetBundleState.unpackedCount = 0;
    presetBundleState.totalCount = 0;
    presetBundleState.errorMessage = null;
    ensureBundleLoadingRedrawLoop();
    drawMenu();

    try {
      const res = await fetch(PRESET_BUNDLE_URL, force ? { cache: 'reload' } : {});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const contentLength = res.headers.get('content-length');
      presetBundleState.totalBytes = contentLength ? parseInt(contentLength, 10) : 0;

      let text;
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let chunks = '';
        let lastDraw = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks += decoder.decode(value, { stream: true });
          presetBundleState.loadedBytes += value.length;
          const now = performance.now();
          if (now - lastDraw > 80) {
            lastDraw = now;
            drawMenu();
          }
        }
        text = chunks;
      } else {
        text = await res.text(); // fallback: no progress during download on this runtime
      }

      presetBundleState.status = 'unpacking';
      drawMenu();

      const bundle = JSON.parse(text);
      presetBundleState.totalCount = Object.keys(bundle).length;
      const unpackedCount = await unpackPresetBundleIntoCache(bundle);

      presetBundleState.status = 'ready';
      localStorage.setItem(PRESET_BUNDLE_UNPACKED_KEY, PRESET_BUNDLE_VERSION);
      log(`Preset bundle ready: ${unpackedCount} presets cached for offline use.`);
    } catch (err) {
      console.error('Failed to load/unpack preset bundle:', err);
      presetBundleState.status = 'error';
      presetBundleState.errorMessage = err.message;
      log('Failed to load preset bundle: ' + err.message);
    }

    drawMenu();
  }

  // Settings tab "Refresh Cache" button: checks for a new service worker
  // version, force-refreshes the app shell, and force re-downloads +
  // re-unpacks the preset bundle.
  function refreshPwaCache() {
    if (!('serviceWorker' in navigator)) {
      log('Service workers are not available in this browser — nothing to refresh.');
      return;
    }
    log('Refreshing PWA cache…');
    navigator.serviceWorker.ready.then((reg) => {
      reg.update().catch(() => {}); // check the server for a newer sw.js
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'REFRESH_SHELL' });
      }
      loadAndUnpackPresetBundle(true);
    });
  }

  var visualizer = null;

  var audioContext = null;
  var audioEl = new Audio();
  //audioEl.crossOrigin = 'anonymous'; // needed if you ever point src at a remote URL
  var mediaSourceNode = null;        // see note below on why this is created only once
  var delayedAudible = null;
  var sourceNode = null;

  var cycleInterval = null;

  const presetCache = new Map();

  var presetKeys = [];
  var presetIndexHist = [];
  var presetIndex = 0;
  var presetCycle = true;
  var presetCycleLength = 25000;
  var presetRandom = true;
  var currentTrackName = null;

  // ---------------------------------------------------------------------------
  // Songs-tab playlist state
  // ---------------------------------------------------------------------------
  var playlist = [];             // [{ name, file }]
  var currentPlaylistIndex = -1; // index into playlist currently loaded into audioEl, or -1
  var currentObjectUrl = null;   // blob URL currently assigned to audioEl.src, for revocation
  var songsScrollOffset = 0;     // first visible row index in the songs-tab list

  // ---------------------------------------------------------------------------
  // Viz-tab preset playlist state (persisted to localStorage, export/importable)
  // ---------------------------------------------------------------------------
  var presetPlaylists = {};       // { playlistName: [presetKey, presetKey, ...] }
  var activePlaylistName = null;  // name of the currently active playlist (always set once loaded)
  var vizPlaylistScrollOffset = 0; // first visible row index in the active playlist's list

  var bcCanvas = document.createElement('canvas');
  // Placeholder size only — initVisualizer() calls resizeCanvasForResolution()
  // to set the real dimensions from RESOLUTION_BASE_SIZES/resolutionIndex
  // and the current projectionMode before anything renders.
  bcCanvas.width = 4096;
  bcCanvas.height = 2048;

  // FPS monitor: when enabled (Settings tab), a small readout is composited
  // directly into the equirect/cylinder layer itself, not the menu — so
  // it's visible in the visualizer even while the menu is closed. Drawing
  // text onto bcCanvas isn't possible (it's WebGL-owned by Butterchurn), so
  // we copy its current frame into a same-sized 2D canvas each frame and
  // draw the readout on top of that copy; see drawFpsOverlay()/onXRFrame().
  var fpsMonitorEnabled = false;
  var fpsOverlayCanvas = document.createElement('canvas');
  var fpsOverlayCtx = fpsOverlayCanvas.getContext('2d');
  fpsOverlayCanvas.width = bcCanvas.width;
  fpsOverlayCanvas.height = bcCanvas.height;

  // ---------------------------------------------------------------------------
  // In-VR menu state (persists across XR sessions)
  // ---------------------------------------------------------------------------
  // Which layer type/geometry is used to project the visualizer in VR.
  // One of: 'equirect180', 'equirect360', 'cylinder180'.
  var projectionMode = 'equirect180';
  var menuActiveTab = 'license'; // 'license' | 'settings' | 'viz' | 'songs'

  // Offscreen 2D canvas the in-VR menu is drawn into, then uploaded as the
  // texture of an XRQuadLayer. Kept separate from bcCanvas (the Butterchurn
  // render target) entirely.
  var menuCanvas = document.getElementById('test');

  //var menuCanvas = document.createElement('canvas');
  menuCanvas.width = 1180;
  menuCanvas.height = 850;
  var menuCtx = menuCanvas.getContext('2d');

  // Where the controller ray currently hits the menu, in canvas-pixel
  // space ({px,py}), or null if no controller is pointing at it. Updated
  // every XR frame while the menu is open (see onXRFrame), then drawn as a
  // cursor dot at the end of drawMenu().
  var menuPointerPx = null;

  // Clickable regions on menuCanvas, in canvas-pixel space, rebuilt every
  // time drawMenu() runs. Populated with {x,y,w,h,action(),repeatable}.
  var menuHitRegions = [];

  // --- Repeat-scroll while the trigger is held on a ▲/▼ scroll button ---
  // A plain selectstart only fires once per press, so without this a held
  // trigger scrolled exactly one page and then sat there. heldScrollAction
  // is re-invoked on a timer (see handleHeldScrollRepeat, called each XR
  // frame) for as long as the same input source that pressed it keeps the
  // trigger down.
  var heldScrollAction = null;
  var heldScrollInputSource = null;
  var heldScrollStartTime = 0;
  var lastScrollRepeatTime = 0;
  const SCROLL_REPEAT_INITIAL_DELAY_MS = 450; // hold this long before repeat kicks in, so a tap only fires once
  const SCROLL_REPEAT_INTERVAL_MS = 150;      // repeat cadence once past the initial delay

  function clearHeldScrollAction() {
    heldScrollAction = null;
    heldScrollInputSource = null;
  }

  // Called every XR frame. No-ops unless a repeatable button is currently
  // held past the initial delay and it's time for the next repeat.
  function handleHeldScrollRepeat(now) {
    if (!heldScrollAction) return;
    if (now - heldScrollStartTime < SCROLL_REPEAT_INITIAL_DELAY_MS) return;
    if (now - lastScrollRepeatTime < SCROLL_REPEAT_INTERVAL_MS) return;
    lastScrollRepeatTime = now;
    heldScrollAction();
  }

  // Each entry is the 180° (1:1) square edge length for that quality step —
  // e.g. 3584 means "3584×3584 in a 180 mode". In 360 mode (1:2) the same
  // step keeps the same total pixel count, just reshaped to a 2:1 rectangle.
  const RESOLUTION_BASE_SIZES = [1024, 2048, 3072, 3584, 4096, 6144];
  let resolutionIndex = 3; // default: 3584×3584

  const MESH_SIZE_OPTIONS = [
  { w: 24,  h: 18 },
  { w: 32,  h: 24 },
  { w: 48,  h: 36 },
  { w: 64,  h: 48 },
  { w: 96,  h: 72 },
  { w: 128, h: 96 }
];
let meshSizeIndex = 2; // default 48 x 36



  // Target FPS cap for visualizer.render() while in an XR session; 0 = uncapped.
  // See onXRFrame() inside startXR() — this only throttles rendering, never
  // the XR posing/compositor callback itself.
  var frameLimit = 45;

  function connectToAudioAnalyzer(sourceNode) {
    if (delayedAudible) {
      delayedAudible.disconnect();
    }

    delayedAudible = audioContext.createDelay();
    delayedAudible.delayTime.value = 0.26;

    sourceNode.connect(delayedAudible)
    delayedAudible.connect(audioContext.destination);

    visualizer.connectAudio(delayedAudible);
  }

  // NOTE: there is no standalone render loop anymore. visualizer.render()
  // is only ever called from inside onXRFrame() (see startXR() below), so
  // rendering only happens — at frameLimit fps — while an XR session is
  // active, and keeps running even if the desktop browser window loses
  // focus (window.requestAnimationFrame does not, which was the bug).

  function playStreamSource(url) {
    audioEl.src = url;
    audioEl.play();

    // A MediaElementAudioSourceNode is bound to its <audio> element for the
    // element's whole lifetime — you can only create ONE per element, ever.
    // So we don't recreate it per track; we just keep changing audioEl.src.
    if (!mediaSourceNode) {
      mediaSourceNode = audioContext.createMediaElementSource(audioEl);
      connectToAudioAnalyzer(mediaSourceNode);
    }
  }

  // ---------------------------------------------------------------------------
  // VR reentry state
  // ---------------------------------------------------------------------------
  var wasInVRBeforeFilePicker = false;
  var isStartingXR = false;

  // ---------------------------------------------------------------------------
  // Songs-tab playlist: add/remove/reorder/play
  // ---------------------------------------------------------------------------
  async function addFilesToPlaylist(files) {
    if (!files || files.length === 0) return;
    if (!audioContext) await initVisualizer(); // first real audio — start the engine now

    const startIndex = playlist.length;
    for (const file of files) {
      playlist.push({ name: file.name, file });
    }
    // If nothing is currently playing, kick off the first newly-added track.
    if (currentPlaylistIndex === -1) {
      playPlaylistIndex(startIndex);
    } else {
      drawMenu();
    }
  }

  function playPlaylistIndex(index) {
    if (index < 0 || index >= playlist.length) return;
    audioContext.resume();

    currentPlaylistIndex = index;
    const item = playlist[index];
    currentTrackName = item.name;

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(item.file);
    playStreamSource(currentObjectUrl);

    // advance on the element's real 'ended' event instead of a
    // setTimeout(buf.duration) guess
    audioEl.onended = () => {
      if (currentPlaylistIndex + 1 < playlist.length) {
        playPlaylistIndex(currentPlaylistIndex + 1);
      } else {
        currentPlaylistIndex = -1;
        drawMenu();
      }
    };

    drawMenu();
  }

  function removePlaylistItem(index) {
    if (index < 0 || index >= playlist.length) return;
    const wasCurrent = index === currentPlaylistIndex;
    playlist.splice(index, 1);

    if (index < currentPlaylistIndex) {
      currentPlaylistIndex--;
    } else if (wasCurrent) {
      if (playlist.length === 0) {
        currentPlaylistIndex = -1;
        currentTrackName = null;
        audioEl.pause();
        audioEl.removeAttribute('src');
        if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      } else {
        // Play whatever now sits at this index (the next track), or wrap to the last.
        playPlaylistIndex(Math.min(index, playlist.length - 1));
        return;
      }
    }

    drawMenu();
  }

  function movePlaylistItem(index, dir) {
    const newIndex = index + dir;
    if (newIndex < 0 || newIndex >= playlist.length) return;
    [playlist[index], playlist[newIndex]] = [playlist[newIndex], playlist[index]];

    if (currentPlaylistIndex === index) currentPlaylistIndex = newIndex;
    else if (currentPlaylistIndex === newIndex) currentPlaylistIndex = index;

    drawMenu();
  }

  // Ends the active XR session, if any. Native browser file dialogs (audio
  // file picker, preset-playlist import) can't render inside an immersive
  // session, so anything that opens one calls this first.
  //
  // Returns a promise that resolves once the session has *actually* finished
  // tearing down (the 'end' event has fired), not just once .end() has been
  // called. Re-entering VR (requestSession again) while the previous session
  // is still mid-teardown is what made auto re-entry flaky — on some
  // runtimes a fresh requestSession() call made too early either throws or
  // silently no-ops because the device still considers itself "in" the old
  // session. Callers that want to re-enter VR afterwards should await this.
  function exitVRIfActive() {
    if (!xrSession) return Promise.resolve();
    const session = xrSession;
    return new Promise((resolve) => {
      session.addEventListener('end', () => resolve(), { once: true });
      session.end().catch((err) => {
        console.error('Failed to end XR session:', err);
        resolve(); // still resolve — the 'end' listener above won't fire if end() itself rejected
      });
    });
  }

  // Tries to jump straight back into VR first — this sometimes succeeds
  // (e.g. when the file was picked quickly enough that the browser still
  // treats the original tap that opened the picker as recent/"active"), but
  // isn't guaranteed: testing showed navigator.xr.requestSession() can throw
  // "SecurityError: ...requires user activation" from here even when called
  // synchronously, with zero async gap, because some browsers don't count
  // selecting a file in the native OS dialog as an activation-granting
  // gesture at all. Falls back to a visible "Re-enter VR" button — a real
  // tap — only if the automatic attempt actually fails.
  async function reenterVRIfNeeded() {
    if (!wasInVRBeforeFilePicker) return;
    wasInVRBeforeFilePicker = false;
    const reentered = await startXR();
    if (!reentered) {
      reenterVRBtn.style.display = 'inline-block';
      log('Tap "Re-enter VR" to jump back in.');
    }
  }

  function openFilePickerForPlaylist() {
    wasInVRBeforeFilePicker = !!xrSession;
    // Not awaited: fileSelector.click() below must run synchronously in this
    // same gesture, or the native file dialog silently never opens.
    exitVRIfActive();
    const fileSelector = document.createElement('input');
    fileSelector.type = 'file';
    fileSelector.accept = 'audio/*';
    fileSelector.multiple = true;
    fileSelector.onchange = () => {
      addFilesToPlaylist(Array.from(fileSelector.files));
      reenterVRIfNeeded();
    };
    fileSelector.click();
  }

  // Helper to load individual preset JSON file
  async function getPresetData(key) {
    if (presetCache.has(key)) {
      return presetCache.get(key);
    }

    try {
      const res = await fetch(`/presets/${encodeURIComponent(key)}.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      // Prevent memory leaks by keeping max 50 presets in memory cache
      if (presetCache.size > 50) {
        const oldestKey = presetCache.keys().next().value;
        presetCache.delete(oldestKey);
      }
      presetCache.set(key, data);
      return data;
    } catch (err) {
      console.error(`Failed to load preset "${key}":`, err);
      return null;
    }
  }

  async function loadPresetAtIndex(index, blendTime) {
    const key = presetKeys[index];
    if (!key) return;

    const presetData = await getPresetData(key);
    if (presetData && visualizer) {
      visualizer.loadPreset(presetData, blendTime);

      const selectElem = document.getElementById('presetSelect');
      if (selectElem) selectElem.value = index;
    }
  }

  // Returns the array of preset key strings that Prev/Next/auto-cycle should
  // draw from: the active preset playlist if one is selected and non-empty,
  // otherwise the full preset library.
  function getActivePresetPool() {
    if (activePlaylistName && presetPlaylists[activePlaylistName] && presetPlaylists[activePlaylistName].length > 0) {
      return presetPlaylists[activePlaylistName];
    }
    return presetKeys;
  }

  async function nextPreset(blendTime = 5.7) {
    const pool = getActivePresetPool();
    if (pool.length === 0) return;

    presetIndexHist.push(presetIndex);

    const currentKey = presetKeys[presetIndex];
    let nextKey;
    if (presetRandom) {
      nextKey = pool[Math.floor(Math.random() * pool.length)];
    } else {
      let poolPos = pool.indexOf(currentKey);
      poolPos = poolPos === -1 ? 0 : (poolPos + 1) % pool.length;
      nextKey = pool[poolPos];
    }

    const idx = presetKeys.indexOf(nextKey);
    if (idx === -1) return;
    presetIndex = idx;

    await loadPresetAtIndex(presetIndex, blendTime);
  }

  async function prevPreset(blendTime = 5.7) {
    if (presetKeys.length === 0) return;

    var numPresets = presetKeys.length;
    if (presetIndexHist.length > 0) {
      presetIndex = presetIndexHist.pop();
    } else {
      presetIndex = ((presetIndex - 1) + numPresets) % numPresets;
    }

    await loadPresetAtIndex(presetIndex, blendTime);
  }

  // ---------------------------------------------------------------------------
  // Preset playlists: persistence, CRUD, export/import
  // ---------------------------------------------------------------------------
  const PRESET_PLAYLISTS_STORAGE_KEY = 'butterchurnPresetPlaylists';
  const DEFAULT_PRESET_PLAYLISTS_URL = './preset-playlists.json';

  // Fetches the server-provided default playlist set and replaces
  // presetPlaylists with it. Used on first boot (nothing in localStorage
  // yet) and whenever the user deletes their last remaining playlist.
  async function loadDefaultPresetPlaylistsFromServer() {
    try {
      const res = await fetch(DEFAULT_PRESET_PLAYLISTS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const source = (data && typeof data.playlists === 'object' && data.playlists) || data || {};

      presetPlaylists = {};
      for (const [name, keys] of Object.entries(source)) {
        if (Array.isArray(keys)) {
          presetPlaylists[name] = keys.filter((k) => typeof k === 'string');
        }
      }

      const names = Object.keys(presetPlaylists);
      activePlaylistName = names.length > 0 ? names[0] : null;
      savePresetPlaylistsToStorage();
      rebuildPresetKeysFromPlaylists();
      log(`Loaded ${names.length} default preset playlist(s) from ${DEFAULT_PRESET_PLAYLISTS_URL}.`);
    } catch (err) {
      console.error('Failed to load default preset playlists from server:', err);
      log(`Could not load default preset playlists from ${DEFAULT_PRESET_PLAYLISTS_URL}: ${err.message}`);
    }
  }

  async function loadPresetPlaylistsFromStorage() {
    try {
      const raw = localStorage.getItem(PRESET_PLAYLISTS_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        presetPlaylists = (parsed && typeof parsed.playlists === 'object' && parsed.playlists) || {};
        activePlaylistName = (parsed && parsed.active) || null;
      }
    } catch (err) {
      console.error('Failed to load preset playlists from storage:', err);
      presetPlaylists = {};
      activePlaylistName = null;
    }

    // First boot (nothing saved yet), or a previously-saved but empty set:
    // seed from the server's default playlist file.
    if (Object.keys(presetPlaylists).length === 0) {
      await loadDefaultPresetPlaylistsFromServer();
    } else if (!activePlaylistName || !presetPlaylists[activePlaylistName]) {
      activePlaylistName = Object.keys(presetPlaylists)[0];
    }
  }

  function savePresetPlaylistsToStorage() {
    try {
      localStorage.setItem(PRESET_PLAYLISTS_STORAGE_KEY, JSON.stringify({
        playlists: presetPlaylists,
        active: activePlaylistName,
      }));
    } catch (err) {
      console.error('Failed to save preset playlists to storage:', err);
    }
  }

  function createPresetPlaylist(name) {
    name = (name || '').trim();
    if (!name || presetPlaylists[name]) return false;
    presetPlaylists[name] = [];
    activePlaylistName = name;
    vizPlaylistScrollOffset = 0;
    savePresetPlaylistsToStorage();
    drawMenu();
    return true;
  }

  // Deletes a playlist. If that was the last one remaining, re-seeds from
  // the server's default playlist file rather than leaving the user with
  // nothing to select.
  async function deletePresetPlaylist(name) {
    if (!presetPlaylists[name]) return;
    delete presetPlaylists[name];
    if (activePlaylistName === name) activePlaylistName = null;
    vizPlaylistScrollOffset = 0;

    if (Object.keys(presetPlaylists).length === 0) {
      await loadDefaultPresetPlaylistsFromServer();
    } else {
      if (!activePlaylistName) activePlaylistName = Object.keys(presetPlaylists)[0];
      savePresetPlaylistsToStorage();
    }
    drawMenu();
  }

  function setActivePresetPlaylist(name) {
    activePlaylistName = name;
    vizPlaylistScrollOffset = 0;
    savePresetPlaylistsToStorage();

    // Jump straight into playing this playlist, not just marking it active.
    const pool = presetPlaylists[name] || [];
    if (visualizer && pool.length > 0) {
      const startKey = pool[Math.floor(Math.random() * pool.length)];
      const idx = presetKeys.indexOf(startKey);
      if (idx !== -1) {
        presetIndexHist.push(presetIndex);
        presetIndex = idx;
        loadPresetAtIndex(presetIndex, 2.7).then(() => {
          restartCycleInterval();
          drawMenu();
        });
        return; // drawMenu() runs once the preset finishes loading, above
      }
    }

    drawMenu();
  }

  function addCurrentPresetToActivePlaylist() {
    if (!activePlaylistName) return;
    const key = presetKeys[presetIndex];
    if (!key) return;
    const list = presetPlaylists[activePlaylistName];
    if (!list.includes(key)) {
      list.push(key);
      savePresetPlaylistsToStorage();
    }
    drawMenu();
  }

  function removePresetFromPlaylist(name, key) {
    const list = presetPlaylists[name];
    if (!list) return;
    const idx = list.indexOf(key);
    if (idx === -1) return;
    list.splice(idx, 1);
    savePresetPlaylistsToStorage();
    drawMenu();
  }

  function exportPresetPlaylists() {
    const data = JSON.stringify({ playlists: presetPlaylists }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'butterchurn-preset-playlists.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    log('Exported preset playlists to butterchurn-preset-playlists.json.');
  }

  // Merges imported playlists into the existing set: new playlist names are
  // added, and for playlist names that already exist, new preset keys are
  // appended (no existing playlists or entries are deleted or overwritten).
  function importPresetPlaylistsFromFile() {
    wasInVRBeforeFilePicker = !!xrSession;
    // Not awaited — see openFilePickerForPlaylist() above.
    exitVRIfActive();
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = () => {
      const file = input.files[0];
      if (!file) {
        reenterVRIfNeeded(); // user cancelled
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const imported = (parsed && typeof parsed.playlists === 'object' && parsed.playlists) || parsed;
          let playlistCount = 0, keyCount = 0;
          for (const [name, keys] of Object.entries(imported)) {
            if (!Array.isArray(keys)) continue;
            if (!presetPlaylists[name]) presetPlaylists[name] = [];
            playlistCount++;
            for (const k of keys) {
              if (typeof k === 'string' && !presetPlaylists[name].includes(k)) {
                presetPlaylists[name].push(k);
                keyCount++;
              }
            }
          }
          savePresetPlaylistsToStorage();
          rebuildPresetKeysFromPlaylists();
          log(`Imported ${playlistCount} preset playlist(s), ${keyCount} new preset entr${keyCount === 1 ? 'y' : 'ies'}.`);
          drawMenu();
          reenterVRIfNeeded();
        } catch (err) {
          log('Failed to import preset playlists: ' + err.message);
          reenterVRIfNeeded(); // re-enter VR even on error
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function restartCycleInterval() {
    if (cycleInterval) {
      clearInterval(cycleInterval);
      cycleInterval = null;
    }

    if (presetCycle) {
      cycleInterval = setInterval(() => nextPreset(2.7), presetCycleLength);
    }
  }

  // Rebuilds presetKeys (the master preset library, used by the top <select>
  // and as the last-resort cycle pool) from the union of every preset
  // referenced across all preset playlists — there is no separate
  // /playlist.json library anymore, so a preset is only "known" once it
  // shows up in at least one playlist.
  function rebuildPresetKeysFromPlaylists() {
    const previousKey = presetKeys[presetIndex];

    const keySet = new Set();
    Object.values(presetPlaylists).forEach((keys) => {
      keys.forEach((k) => keySet.add(k));
    });
    presetKeys = Array.from(keySet).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

    // Keep pointing at the same preset (by key) if it's still in the library.
    if (previousKey) {
      const idx = presetKeys.indexOf(previousKey);
      if (idx !== -1) {
        presetIndex = idx;
      }
    }
  }

  async function initVisualizer() {
    audioContext = new AudioContext();
    resizeCanvasForResolution(); // size bcCanvas per the current resolution + projection setting

    visualizer = butterchurn.createVisualizer(audioContext, bcCanvas, {
      width: bcCanvas.width,
      height: bcCanvas.height,
      pixelRatio: window.devicePixelRatio || 1,
      textureRatio: 1,
    });

    // Preset library comes from the preset playlists (loaded earlier via
    // loadPresetPlaylistsFromStorage), not a fetch — rebuild it here in case
    // that hasn't happened yet for some reason.
    if (presetKeys.length === 0) {
      rebuildPresetKeysFromPlaylists();
    }

    // Start initial preset and cycle, drawn from the active preset playlist
    // (the first playlist loaded, by default) rather than the full merged
    // library — see getActivePresetPool().
    const startPool = getActivePresetPool();
    if (startPool.length > 0) {
      const startKey = startPool[Math.floor(Math.random() * startPool.length)];
      const startIdx = presetKeys.indexOf(startKey);
      presetIndex = startIdx !== -1 ? startIdx : 0;
      await loadPresetAtIndex(presetIndex, 0);
    }

    restartCycleInterval();
  }

    function drawButton(bx, by, bw, bh, label, action, repeatable = false) {

      ctx.fillText(label, bx + size / 2, by + size / 2 + 1);

    // Discrete "slider": a filled track + thumb, with one tap-target per step
// (tapping anywhere along that step's slice jumps straight to it).
function drawStepSlider(sx, sy, sw, valueLabel, index, maxIndex, onChange) {
  const trackH = 10;
  const trackY = sy + 14;

  ctx.font = '18px Arial';
  ctx.fillStyle = '#9cf';
  ctx.textAlign = 'right';
  ctx.fillText(valueLabel, sx + sw, sy);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(sx, trackY, sw, trackH);
  const frac = maxIndex === 0 ? 0 : index / maxIndex;
  ctx.fillStyle = '#5a8fd6';
  ctx.fillRect(sx, trackY, sw * frac, trackH);

  const stepW = sw / (maxIndex + 1);
  for (let i = 0; i <= maxIndex; i++) {
    menuHitRegions.push({
      x: sx + i * stepW, y: trackY - 20, w: stepW, h: 50,
      action: () => onChange(i)
    });
  }

  ctx.beginPath();
  ctx.arc(sx + sw * frac, trackY + trackH / 2, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#9cf';
  ctx.fill();
  ctx.strokeStyle = '#1a1a24';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// Shown on the License tab in place of the license text until the preset
// bundle has been downloaded and unpacked into individual cache entries.
function drawPresetBundleLoadingScreen(contentX, ly, W) {
  const state = presetBundleState;

  if (state.status === 'error') {
    ctx.fillStyle = '#f88';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Failed to load presets', contentX, ly);
    ctx.font = '18px Arial';
    ctx.fillStyle = '#999';
    ctx.fillText(state.errorMessage || 'Unknown error', contentX, ly + 32);
    drawButton(contentX, ly + 64, 160, 56, 'Retry', () => {
      loadAndUnpackPresetBundle(true);
    });
    return;
  }

  let title, sublabel, frac;
  if (state.status === 'unpacking') {
    title = 'Unpacking presets into cache…';
    frac = state.totalCount > 0 ? state.unpackedCount / state.totalCount : 0;
    sublabel = `${state.unpackedCount} / ${state.totalCount}`;
  } else {
    // 'downloading' or 'idle' (idle only for one frame before the fetch kicks off)
    title = 'Downloading presets…';
    if (state.totalBytes > 0) {
      frac = state.loadedBytes / state.totalBytes;
      sublabel = `${(state.loadedBytes / 1048576).toFixed(1)} / ${(state.totalBytes / 1048576).toFixed(1)} MB`;
    } else {
      frac = null; // unknown size — indeterminate bar
      sublabel = `${(state.loadedBytes / 1048576).toFixed(1)} MB downloaded`;
    }
  }

  ctx.fillStyle = '#eee';
  ctx.font = 'bold 26px Arial';
  ctx.fillText(title, contentX, ly);
  ly += 40;

  const barW = W - 2 * contentX, barH = 28;
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(contentX, ly, barW, barH);

  if (frac === null) {
    // Indeterminate: a segment sweeping back and forth.
    const segW = barW * 0.28;
    const period = 1400;
    const t = (performance.now() % period) / period;
    const sweep = t < 0.5 ? t * 2 : 2 - t * 2;
    ctx.fillStyle = '#5a8fd6';
    ctx.fillRect(contentX + (barW - segW) * sweep, ly, segW, barH);
  } else {
    ctx.fillStyle = '#5a8fd6';
    ctx.fillRect(contentX, ly, barW * Math.max(0, Math.min(1, frac)), barH);
  }
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(contentX, ly, barW, barH);
  ly += barH + 26;

  ctx.font = '18px Arial';
  ctx.fillStyle = '#999';
  ctx.textAlign = 'left';
  ctx.fillText(sublabel, contentX, ly);
  if (frac !== null) {
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.round(frac * 100)}%`, contentX + barW, ly);
    ctx.textAlign = 'left';
  }
  ly += 40;

  ctx.font = '16px Arial';
  ctx.fillStyle = '#777';
  ctx.fillText('This only happens once — presets are cached for offline use afterward.', contentX, ly);
}

  const totalPixels = base * base;
  const ratio = getProjectionAspectRatio();
  const h = Math.round(Math.sqrt(totalPixels / ratio));
  const w = Math.round(h * ratio);
  return { w, h };
}

  function resizeCanvasForResolution(){
  const { w, h } = getResolutionDimensions();

  bcCanvas.width = w;
  bcCanvas.height = h;
  fpsOverlayCanvas.width = w;
  fpsOverlayCanvas.height = h;
  if (visualizer) visualizer.setRendererSize(w, h);
rebuildVizLayerIfActive();
  }

  // Copies the just-rendered frame from bcCanvas into fpsOverlayCanvas and
  // stamps an FPS readout on top of the copy, scaled to the canvas size so
  // it stays legible regardless of the resolution setting. Returns the
  // overlay canvas, which the caller uploads to the XR layer instead of
  // bcCanvas directly.
  function drawFpsOverlay(fps) {
    const w = fpsOverlayCanvas.width, h = fpsOverlayCanvas.height;
    fpsOverlayCtx.drawImage(bcCanvas, 0, 0, w, h);

    const fontSize = Math.max(24, Math.round(h / 28));
    const pad = Math.round(fontSize * 0.5);
    const label = `${fps} FPS`;

    fpsOverlayCtx.font = `bold ${fontSize}px Arial`;
    const textW = fpsOverlayCtx.measureText(label).width;
    const boxW = textW + pad * 2;
    const boxH = fontSize + pad * 2;

    // Position the box in the exact center of the canvas
    const boxX = (w - boxW) / 2;
    const boxY = (h - boxH) / 2;

    fpsOverlayCtx.fillStyle = 'rgba(0,0,0,0.55)';
    fpsOverlayCtx.fillRect(boxX, boxY, boxW, boxH);

    fpsOverlayCtx.fillStyle = fps >= frameLimit * 0.9 || frameLimit === 0 ? '#8f8' : (fps >= frameLimit * 0.6 ? '#ff8' : '#f88');
    fpsOverlayCtx.textAlign = 'left';
    fpsOverlayCtx.textBaseline = 'middle';
    fpsOverlayCtx.fillText(label, boxX + pad, boxY + boxH / 2 + 1);
    fpsOverlayCtx.textAlign = 'left';
    fpsOverlayCtx.textBaseline = 'alphabetic';

    return fpsOverlayCanvas;
  }

  // Opens the menu ~1.1m in front of wherever the headset was looking when
  // grip was pressed, matching the viewer's full orientation (so it's
  // "attached to gaze" at open time, not billboarded every frame after).
  function openMenu(frame) {
    const viewerPose = frame.getViewerPose(vizRefSpace);
    if (!viewerPose) return;
    const { position, orientation } = viewerPose.transform;

    const forward = applyQuatToVec(orientation, { x: 0, y: 0, z: -1 });
    const distance = 1.5;
    const menuPos = {
      x: position.x + forward.x * distance,
      y: position.y + forward.y * distance - 0.05,
      z: position.z + forward.z * distance,
    };

    const width = 0.85;
    const height = width * (menuCanvas.height / menuCanvas.width);
    menuPlane = { position: menuPos, orientation, width, height };

    const menuSpace = vizRefSpace.getOffsetReferenceSpace(new XRRigidTransform(menuPos, orientation));
    menuLayer = xrGlBinding.createQuadLayer({
      space: menuSpace,
      viewPixelWidth: menuCanvas.width,
      viewPixelHeight: menuCanvas.height,
      layout: 'mono',
      width,
      height,
    });
    uploadMenu = createCanvasUploader(glFromBinding);

    menuOpen = true;
    drawMenu();
    updateRenderStateLayers();
  }

  function closeMenu() {
    menuOpen = false;
    updateRenderStateLayers();
    if (menuLayer) { menuLayer.destroy(); menuLayer = null; }
    menuPlane = null;
    menuPointerPx = null;
    clearHeldScrollAction();
  }

  function toggleMenu(frame) {
    if (menuOpen) closeMenu(); else openMenu(frame);
  }

  // Intersects a controller's target ray (given as an XRPose in vizRefSpace)
  // against the menu's quad plane, returning canvas-pixel coordinates on a
  // hit, or null. Plain vector math — the Layers API doesn't do hit-testing
  // for you, since a quad layer isn't a scene-graph object.
  function raycastMenuToCanvasPx(rayPose) {
    if (!menuPlane) return null;

    const rayOrigin = rayPose.transform.position;
    const rayDir = applyQuatToVec(rayPose.transform.orientation, { x: 0, y: 0, z: -1 });

    // The quad's front face (the side the viewer was facing when it opened)
    // points back along its own +Z axis, since it was placed facing the
    // viewer's -Z (forward) direction.
    const normal = applyQuatToVec(menuPlane.orientation, { x: 0, y: 0, z: 1 });
    const denom = vecDot(rayDir, normal);
    if (Math.abs(denom) < 1e-6) return null; // ray parallel to plane

    const t = vecDot(vecSub(menuPlane.position, rayOrigin), normal) / denom;
    if (t <= 0) return null; // plane is behind the ray origin

    const hit = { x: rayOrigin.x + rayDir.x * t, y: rayOrigin.y + rayDir.y * t, z: rayOrigin.z + rayDir.z * t };
    const local = vecSub(hit, menuPlane.position);

    const right = applyQuatToVec(menuPlane.orientation, { x: 1, y: 0, z: 0 });
    const up = applyQuatToVec(menuPlane.orientation, { x: 0, y: 1, z: 0 });
    const uOffset = vecDot(local, right);
    const vOffset = vecDot(local, up);

    const u = uOffset / menuPlane.width + 0.5;
    const v = 0.5 - vOffset / menuPlane.height;
    if (u < 0 || u > 1 || v < 0 || v > 1) return null; // hit the plane but outside the quad

    return { px: u * menuCanvas.width, py: v * menuCanvas.height };
  }

  function handleMenuSelect(frame, inputSource) {
    if (!menuOpen || !menuLayer || !inputSource.targetRaySpace) return;
    const rayPose = frame.getPose(inputSource.targetRaySpace, vizRefSpace);
    if (!rayPose) return;

    const hit = raycastMenuToCanvasPx(rayPose);
    if (!hit) return;

    for (const region of menuHitRegions) {
      if (hit.px >= region.x && hit.px <= region.x + region.w &&
          hit.py >= region.y && hit.py <= region.y + region.h) {
        region.action();
        if (region.repeatable) {
          heldScrollAction = region.action;
          heldScrollInputSource = inputSource;
          heldScrollStartTime = performance.now();
          lastScrollRepeatTime = heldScrollStartTime;
        }
        break;
      }
    }
  }

  // Called once per XR frame while the menu is open. Walks the active input
  // sources, finds the first whose ray hits the menu plane, and updates
  // menuPointerPx so drawMenu() can render a cursor there. Cleared to null
  // when nothing is pointing at the menu.
  function updateMenuPointer(frame, session) {
    menuPointerPx = null;
    for (const inputSource of session.inputSources) {
      if (!inputSource.targetRaySpace) continue;
      const rayPose = frame.getPose(inputSource.targetRaySpace, vizRefSpace);
      if (!rayPose) continue;
      const hit = raycastMenuToCanvasPx(rayPose);
      if (hit) {
        menuPointerPx = { px: hit.px, py: hit.py };
        break; // first hit wins — fine for the common one-hand-pointing case
      }
    }
  }

  // Stashed so setProjectionMode/openMenu can build canvas uploaders without
  // threading `gl` through every function signature.
  var glFromBinding = null;

  const enterVRBtn = document.getElementById('enterVR');
  const reenterVRBtn = document.getElementById('reenterVR');
  let xrSupported = false;

  async function checkXRSupport() {
    if (!navigator.xr) {
      log('navigator.xr is not available (no WebXR in this browser/context — needs HTTPS).');
      return;
    }
 xrSupported = await navigator.xr.isSessionSupported('immersive-vr');
  if (xrSupported) {
    enterVRBtn.disabled = false;
    enterVRBtn.textContent = 'Enter VR';
    if (isInstalledQuestPwa) {
      startXR(); // auto-launch — only legitimate here
    }
  }
}
  checkXRSupport();

  let xrSession = null;

  enterVRBtn.addEventListener('click', async () => {
    // Entering VR no longer forces the visualizer to start — if no track has
    // been loaded yet, startXR() opens the menu instead so there's
    // something to do (Songs tab → "+ Add songs") rather than starting a
    // random preset with no audio connected.
    await startXR();
  });

  reenterVRBtn.addEventListener('click', async () => {
    reenterVRBtn.style.display = 'none';
    await startXR();
  });

  // Returns true if the session was started successfully, false otherwise —
  // callers that have a fallback plan for failure (see reenterVRIfNeeded)
  // check this instead of assuming success.
  async function startXR() {
    // Guards against overlapping requestSession() calls — e.g. the
    // auto-launch on boot racing with a manual Enter VR click, or two
    // file-picker re-entry paths firing close together. Browsers reject a
    // second concurrent requestSession() with an error, which — before this
    // guard existed — was silently swallowed by the catch below and made
    // "auto re-enter VR" look like it randomly failed.
    if (isStartingXR || xrSession) {
      log(`startXR() skipped — isStartingXR=${isStartingXR}, already in a session=${!!xrSession}.`);
      return false;
    }
    isStartingXR = true;

    let session;
    try {
      session = await navigator.xr.requestSession('immersive-vr', {
        requiredFeatures: ['layers', 'local'],
      });
    } catch (err) {
      log('Failed to start session with "layers" feature required: ' + err.name + ': ' + err.message +
          '\nYour browser likely does not support the WebXR Layers API, or this call was not made ' +
          'directly on a user gesture. Try Meta Quest Browser or desktop Chrome with WebXR Layers enabled.');
      isStartingXR = false;
      return false;
    }
    xrSession = session;
    isStartingXR = false;
    reenterVRBtn.style.display = 'none'; // in case it was showing from an earlier file-picker round trip
    log('XR session created — setting up layers, input, and the render loop…');

    try {

    xrSession.addEventListener('end', () => {
      xrSession = null;
      xrGlBinding = null;
      vizRefSpace = null;
      vizLayer = null;
      uploadViz = null;
      menuOpen = false;
      menuLayer = null;
      uploadMenu = null;
      menuPlane = null;
      glFromBinding = null;
      joystickPrimed = {};
      faceButtonPrimed = {};
      autoOpenMenuOnNextFrame = false;
      clearHeldScrollAction();
      log('XR session ended.');
    });

    // A dedicated canvas/GL context just for XR compositing. This context is
    // SEPARATE from Butterchurn's own canvas/context — we only ever read
    // Butterchurn's canvas as a texture *source*, we never share GL contexts.
    const xrCanvas = document.createElement('canvas');
    const gl = xrCanvas.getContext('webgl2', { xrCompatible: true });
    if (gl.makeXRCompatible) {
      await gl.makeXRCompatible();
    }
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    glFromBinding = gl;

    // Binding is what lets us create layers backed by this WebGL context.
    xrGlBinding = new XRWebGLBinding(xrSession, gl);
    vizRefSpace = await xrSession.requestReferenceSpace('local');

    // bcCanvas needs to be correctly sized (per Settings) before the viz
    // layer is created from it, whether or not the visualizer itself has
    // started yet — resizeCanvasForResolution() is safe to call with no
    // visualizer (it no-ops the parts that need one).
    resizeCanvasForResolution();

    // The visualizer's own projection layer — equirect (180/360) or
    // cylinder (180), per the current Settings-tab choice. radius: 0 on the
    // equirect layers means "infinite" — rendered like a skybox, always
    // centered on the viewer regardless of how far they walk.
    vizLayer = createVizLayer(projectionMode);
    uploadViz = createCanvasUploader(gl);
    vizBlankFrameUploaded = false;
    updateRenderStateLayers();

    // No track loaded yet — open the menu on the License tab on the first
    // frame instead of leaving the person in an empty scene.
    if (!visualizer) {
      menuActiveTab = 'license';
      autoOpenMenuOnNextFrame = true;
    }


    // --- Grip (squeeze) toggles the in-VR menu; trigger (select) clicks it ---
    // XRInputSourceEvent carries its own `.frame`, so both handlers can pose
    // things (viewer pose to place the menu, target-ray pose to raycast it)
    // without waiting for the next onXRFrame tick.
    xrSession.addEventListener('squeezestart', (evt) => {
      toggleMenu(evt.frame);
    });
    xrSession.addEventListener('selectstart', (evt) => {
      handleMenuSelect(evt.frame, evt.inputSource);
    });
    // Releasing the trigger stops any hold-to-repeat scrolling it started.
    // Guarded to the same inputSource so releasing a *different* controller's
    // trigger (e.g. the off-hand one) doesn't cancel an in-progress repeat.
    xrSession.addEventListener('selectend', (evt) => {
      if (evt.inputSource === heldScrollInputSource) {
        clearHeldScrollAction();
      }
    });

    // --- Frame limiting + FPS monitoring, folded into onXRFrame itself ---
    // These replace the old standalone startRenderer()/playStreamSource()
    // path entirely: visualizer.render() now ONLY runs from inside
    // onXRFrame, at up to frameLimit fps, and only while in VR.
    let lastRenderTime = performance.now();
    const frameInterval = frameLimit > 0 ? 1000 / frameLimit : 0;
    let frameCount = 0;
    let fpsLastTime = performance.now();
    let currentFps = 0;

    function shouldRenderThisFrame(now) {
      if (frameLimit === 0) return true;
      const elapsed = now - lastRenderTime;
      if (elapsed <= frameInterval) return false;
      lastRenderTime = now - (elapsed % frameInterval);
      return true;
    }

    function tickFps(now) {
      frameCount++;
      if (now - fpsLastTime >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        fpsLastTime = now;
        log(`Render FPS: ${currentFps}${frameLimit ? ' (capped at ' + frameLimit + ')' : ' (uncapped)'}`);
      }
    }

    function onXRFrame(time, frame) {
      const session = frame.session;
      // UNCONDITIONAL — every XR frame, no throttling above this line.
      // Keeps head-pose polling / compositor reprojection at the
      // headset's full native rate regardless of frameLimit below.
      session.requestAnimationFrame(onXRFrame);

      if (autoOpenMenuOnNextFrame && frame.getViewerPose(vizRefSpace)) {
        autoOpenMenuOnNextFrame = false;
        openMenu(frame);
      }

      // Thumbstick prev/next is also unthrottled, so a flick registers
      // immediately rather than waiting on the render-frame cap.
      handleJoystickNav(session);
      handleJoystickScroll(session);
      handleFavoriteButtons(session);
      handleHeldScrollRepeat(performance.now());

      const now = performance.now();
      if (!shouldRenderThisFrame(now)) {
        // Posing above still happened; we're just not re-rendering the
        // preset or re-uploading the texture this frame. The compositor
        // reprojects the last submitted texture(s) against the fresh pose
        // it just got.
        return;
      }

      if (visualizer) visualizer.render();
      tickFps(now);

      if (!frame.getViewerPose(vizRefSpace)) return;

      // Before a track/preset is loaded, bcCanvas never changes — nothing
      // draws to it — so re-uploading it into vizLayer on every single frame
      // (a full texImage2D of a multi-megapixel canvas, up to frameLimit
      // times/sec) is pure wasted GPU work. That's exactly the window right
      // after boot: shaders are still compiling and the preset bundle is
      // still downloading/unpacking on the main thread, so burning extra
      // GPU time here is what shows up as "laggy while the viz is hidden."
      // Upload it once so the layer isn't left with undefined contents, then
      // skip re-uploading until there's an actual visualizer producing new
      // frames.
      if (vizLayer && (visualizer || !vizBlankFrameUploaded)) {
        const subImage = xrGlBinding.getSubImage(vizLayer, frame);
        const uploadSource = fpsMonitorEnabled ? drawFpsOverlay(currentFps) : bcCanvas;
        uploadViz(subImage, uploadSource);
        if (!visualizer) vizBlankFrameUploaded = true;
      }
      // The menu is static content-wise between clicks, but the pointer
      // cursor moves every frame, so we recompute where it's pointing and
      // redraw before re-uploading (cheap next to the visualizer render).
      if (menuOpen && menuLayer) {
        updateMenuPointer(frame, session);
        drawMenu();
        const menuSubImage = xrGlBinding.getSubImage(menuLayer, frame);
        uploadMenu(menuSubImage, menuCanvas);
      }
    }

    xrSession.requestAnimationFrame(onXRFrame);
    log('In VR: ' + projectionMode + ' layer is live. Press grip to open the menu. Take off/put on the headset, or check the emulator.');
    return true;

    } catch (err) {
      // Anything in the setup above (GL context, layer creation, reference
      // space, etc.) throwing here used to silently reject startXR()'s
      // returned promise — nobody awaits/catches it from the file-picker
      // re-entry path, so the failure was completely invisible and it just
      // looked like "doesn't re-enter VR" with no clue why. Surfacing it
      // here, and ending the half-set-up session so a retry isn't blocked
      // by the isStartingXR/xrSession guard above.
      log('startXR() setup failed after the session was created: ' + err.name + ': ' + err.message);
      console.error('startXR() setup error:', err);
      try { xrSession.end(); } catch (endErr) { /* best effort */ }
      return false;
    }
  }
  // ---------------------------------------------------------------------------
  // Desktop-mode menu interactivity
  // ---------------------------------------------------------------------------
  // The menu canvas (#test) is visible on the page at all times, not just in
  // VR. It's already backed by menuHitRegions ({x,y,w,h,action} in
  // canvas-pixel space), the same array the controller raycasting in
  // handleMenuSelect() uses — so mouse clicks just need to hit-test against
  // that same array instead of raycasting a 3D plane.
  function canvasCoordsFromMouseEvent(evt) {
    const rect = menuCanvas.getBoundingClientRect();
    const scaleX = menuCanvas.width / rect.width;
    const scaleY = menuCanvas.height / rect.height;
    return {
      px: (evt.clientX - rect.left) * scaleX,
      py: (evt.clientY - rect.top) * scaleY,
    };
  }

  function hitRegionAt(px, py) {
    for (const region of menuHitRegions) {
      if (px >= region.x && px <= region.x + region.w &&
          py >= region.y && py <= region.y + region.h) {
        return region;
      }
    }
    return null;
  }

  menuCanvas.style.cursor = 'default';

  // Hover feedback: reuses menuPointerPx (the same field the VR cursor dot
  // uses in drawMenu()) so hovering a button on desktop highlights it the
  // same way pointing at it with a controller does in VR.
  menuCanvas.addEventListener('mousemove', (evt) => {
    const { px, py } = canvasCoordsFromMouseEvent(evt);
    menuPointerPx = { px, py };
    menuCanvas.style.cursor = hitRegionAt(px, py) ? 'pointer' : 'default';
    drawMenu();
  });
  menuCanvas.addEventListener('mouseleave', () => {
    menuPointerPx = null;
    drawMenu();
  });
  menuCanvas.addEventListener('click', (evt) => {
    const { px, py } = canvasCoordsFromMouseEvent(evt);
    const region = hitRegionAt(px, py);
    if (region) region.action();
    // Some actions (prev/next preset) don't redraw themselves; harmless to
    // redraw again if the action already did.
    drawMenu();
  });

  (async () => {
    await loadPresetPlaylistsFromStorage();
    resizeCanvasForResolution(); // correct bcCanvas/vizLayer sizing even before any track is loaded
    drawMenu();
  })();

  // Runs in parallel with the above — drives the License tab's loading bar
  // until the preset bundle is downloaded and unpacked into the cache.
  loadAndUnpackPresetBundle(false);

});
</script>
</body>
</html>
